name: Prek checks
on: [push, pull_request]

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          targets: thumbv7em-none-eabihf
          components: rust-src,rustfmt,clippy
      - uses: j178/prek-action@v2

name: Run Tests

on: [ "push" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          targets: thumbv7em-none-eabihf
          components: rust-src,rustfmt,clippy
      - uses: actions-rs/cargo@v1
        with:
          command: build-fw
          args: --release --verbose
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: -p log-sniffer
      - name: Test default members
        uses: actions-rs/cargo@v1
        with:
          command: test
      - name: Test pedalbox-telemetry (default / no_std)
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: -p pedalbox-telemetry
      - name: Test pedalbox-telemetry (std feature)
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: -p pedalbox-telemetry --features std

[package]
name = "log-sniffer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
log = "0.4.29"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-serial = "5.4.5"
defmt-decoder = { version = "1.1.0", features = ["unstable"] }
mcap = "0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
defmt-parser = "1.0.0"
time = { version = "0.3", features = ["formatting"] }
pedalbox-telemetry = { path = "../pedalbox-telemetry", features = ["std"]}
postcard = "1"

[dev-dependencies]
tokio-test = "0.4.5"

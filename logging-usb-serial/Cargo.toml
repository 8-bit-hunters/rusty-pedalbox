[package]
name = "logging-usb-serial"
version = "0.1.0"
edition = "2024"
authors.workspace = true
description.workspace = true

[dependencies]
critical-section = "1.2.0"
portable-atomic = "1.13.1"
pedalbox-telemetry = { path = "../pedalbox-telemetry" }
postcard = "1.1.3"
defmt = { version = "1.1.1", optional = true }

[features]
default = ["buffersize-256"]
buffersize-64 = []
buffersize-128 = []
buffersize-256 = []
buffersize-512 = []
buffersize-1024 = []
defmt-logger = ["dep:defmt"]

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
pollster = "0.4.0"

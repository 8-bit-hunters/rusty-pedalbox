[package]
name = "logging-usb-serial"
version = "0.1.0"
edition = "2024"
authors.workspace = true
description.workspace = true

[dependencies]
critical-section = "1.2.0"
portable-atomic = "1.13.1"
pedalbox-telemetry = { path = "../pedalbox-telemetry" }
postcard = "1.1.3"
embassy-sync = "0.8.0"
defmt = { version = "1.1.1", optional = true }
embassy-usb = { version = "0.6.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
static_cell = { version = "2.1.1", optional = true }

[features]
default = ["buffersize-256"]
buffersize-64 = []
buffersize-128 = []
buffersize-256 = []
buffersize-512 = []
buffersize-1024 = []
defmt-logger = ["dep:defmt"]
usb = ["dep:embassy-usb", "dep:embassy-time", "dep:embassy-futures", "dep:static_cell"]

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
pollster = "0.4.0"
